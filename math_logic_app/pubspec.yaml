name: math_logic_app
description: "Brain & Math Lab - Aplikasi belajar Matematika & Logika (Material 3, offline-first)."
publish_to: 'none'
version: 1.4.2+2401

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  intl: 0.20.3
  share_plus: ^10.0.0
  connectivity_plus: ^6.0.0
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  image: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/bank/
