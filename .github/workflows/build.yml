# PENTING: file workflow WAJIB di root repo (.github/workflows/).
# Jangan taruh di dalam subfolder proyek — GitHub mengabaikannya.
name: Build Android & iOS

on:
  push:
    branches: [main]
    paths:
      - 'math_logic_app/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: math_logic_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: dart run tool/export_bank.dart
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            math_logic_app/build/app/outputs/flutter-apk/*.apk
            math_logic_app/build/app/outputs/bundle/release/*.aab

  ios:
    # IPA TIDAK bisa dibangun di Windows — job ini jalan di runner macOS.
    runs-on: macos-latest # pastikan image membawa Xcode 27+ (cek BUILD_MATRIX.md)
    defaults:
      run:
        working-directory: math_logic_app
    steps:
      - uses: actions/checkout@v4
      - run: ls /Applications | grep -i xcode
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: dart run tool/export_bank.dart
      - run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: math_logic_app/build/ios/ipa/*.ipa
